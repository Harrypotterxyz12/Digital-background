<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete your download — DigitalVault</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="wrap" style="min-height:80vh;display:grid;place-items:center"><section class="product-card" style="max-width:560px;width:100%;text-align:center;padding:32px"><p class="eyebrow">ORDER STATUS</p><h1 id="title">Checking your payment…</h1><p id="message" class="muted">Please keep this page open while we verify the transaction.</p><a id="download" class="button primary" hidden>Download your product ↓</a><p><a class="nav-link" href="/">Return to store</a></p></section></main><script>
const params = new URLSearchParams(location.search);
const provider = params.get("provider");
const title = document.querySelector("#title");
const message = document.querySelector("#message");
const button = document.querySelector("#download");

async function run() {
  try {
    if (provider === "stripe") {
      const sessionId = params.get("session_id");
      if (!sessionId) throw new Error("Missing checkout session.");
      // The server checks Stripe's payment_status before serving the file.
      const url = "/api/download/stripe?session_id=" + encodeURIComponent(sessionId);
      const check = await fetch(url, { method: "HEAD" });
      if (!check.ok) throw new Error("Payment is not confirmed yet. If you were charged, contact support.");
      title.textContent = "Payment verified!";
      message.textContent = "Your download is ready.";
      button.href = url; button.hidden = false;
    } else if (provider === "paypal") {
      // PayPal redirects back with a token/order ID. Capture happens server-side.
      const orderId = params.get("token");
      if (!orderId) throw new Error("Missing PayPal order ID.");
      const captureResponse = await fetch("/api/checkout/paypal/capture", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderId })
      });
      const capture = await captureResponse.json();
      if (!captureResponse.ok || !capture.ok) throw new Error(capture.error || "PayPal payment could not be confirmed.");
      const url = "/api/download/paypal?order_id=" + encodeURIComponent(orderId);
      const check = await fetch(url, { method: "HEAD" });
      if (!check.ok) throw new Error("Payment was not confirmed. If you were charged, contact support.");
      title.textContent = "Payment verified!";
      message.textContent = "Your download is ready.";
      button.href = url; button.hidden = false;
    } else {
      throw new Error("Unknown payment provider.");
    }
  } catch (e) {
    title.textContent = "Payment status";
    message.textContent = e.message;
  }
}
run();
</script></body></html>
